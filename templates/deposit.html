{% extends "base.html" %}


{% block title %}
Deposit
{% endblock %}



{% block content %}

<h1>Deposit Money</h1>

<form method="POST" class="form-card">

    <input 
    type="number"
    name="account_id"
    placeholder="Account ID"
    required
    >

    <input
    type="number"
    name="amount"
    placeholder="Amount"
    required
    >

    <button type="submit">
        Deposit
    </button>

</form>


{% endblock %}
