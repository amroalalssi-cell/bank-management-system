{% extends "base.html" %}


{% block title %}
Login
{% endblock %}



{% block content %}


<div class="login-box">


    <h1>
        Account Login
    </h1>


    <form method="POST">


        <label>
            Username
        </label>

        <input 
        type="text" 
        name="username"
        placeholder="Enter username"
        required>


        <label>
            Password
        </label>

        <input 
        type="password"
        name="password"
        placeholder="Enter password"
        required>


        <button type="submit">
            Login
        </button>


    </form>


</div>


{% endblock %}
